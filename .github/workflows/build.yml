name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Pin androidx.core
        run: |
          cat >> android/build.gradle <<'EOF'
          allprojects {
            configurations.all {
              resolutionStrategy {
                force 'androidx.core:core:1.13.1'
                force 'androidx.core:core-ktx:1.13.1'
              }
            }
          }
          EOF
      - run: sed -i 's|<application|<uses-permission android:name="android.permission.READ_CALENDAR"/><uses-permission android:name="android.permission.WRITE_CALENDAR"/><application|' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: jadwal-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
